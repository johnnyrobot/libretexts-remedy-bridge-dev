name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check operator-only canary preparation without network
        run: |
          bash -n tools/cxone-canary-wizard.sh
          shellcheck -e SC1087,SC2329 tools/cxone-canary-wizard.sh
          node --test tools/canary-static.test.mjs
