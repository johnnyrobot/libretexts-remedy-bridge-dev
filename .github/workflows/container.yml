name: Container runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  signed-writer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build bridge with its POSIX ledger runtime
        run: docker build -t remedy-bridge:ci .
      - name: Exercise actual bridge and ledger without external networking
        run: docker run --rm --init --network none --memory=2g --cpus=2 --pids-limit=256 remedy-bridge:ci npm test

  browser-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the non-root sandboxed browser runtime
        run: docker build -t remedy-browser:ci browser-scanner
      - name: Record unchanged base NSS and tool availability
        run: docker run --rm --network none remedy-browser:ci sh -c 'dpkg-query -W libnss3 libnss3-tools; command -v certutil || true'
      - name: Exercise actual Chromium with network disabled and finite resources
        run: docker run --rm --init --user 1001:1001 --read-only --cap-drop=ALL --security-opt no-new-privileges --network none --memory=2g --cpus=1.5 --pids-limit=256 --shm-size=1g --tmpfs /tmp:rw,nosuid,nodev,size=512m --security-opt seccomp=browser-scanner/shipping-seccomp-amd64.json -e HOME=/tmp/renderer-parent-home -e XDG_CACHE_HOME=/tmp/renderer-parent-home/cache -e XDG_CONFIG_HOME=/tmp/renderer-parent-home/config -e RUN_BROWSER_TESTS=1 --stop-timeout=30 remedy-browser:ci sh -c 'umask 077; mkdir -p "$HOME"; npm test'
